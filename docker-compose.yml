version: "3.9"

services:
  backend:
    build: ./backend
    container_name: chat-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    container_name: chat-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
  mongo:
    image: mongo
    container_name: chat-mongo
    ports:
      - "27017:27017"